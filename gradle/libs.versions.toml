[versions]
agp = "8.13.2"
glide = "4.16.0"
cameraCore = "1.5.2"
coreSplashscreen = "1.2.0"
guava = "33.5.0-android"
kotlin = "2.3.0"
coreKtx = "1.17.0"
junit = "4.13.2"
